name: "CI dev"

on:
  workflow_dispatch:
  push:
    branches:
      - develop

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v1

      - name: Set up AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Replace API endpoint
        run: |
          for file in ./frontEnd/*.js; do
            sed -i "s|{{API_ENDPOINT}}|${{ vars.DEV_API_ENDPOINT }}|g" "$file"
          done

      - name: Generate file hash and rename
        run: |
          # Find all .js files and generate a hash
          for file in ./frontEnd/*.js; do
            FILE_HASH=$(sha256sum "$file" | cut -d ' ' -f 1)
            NEW_NAME="$(basename "$file" .js).${FILE_HASH}.js"
            mv "$file" "./frontEnd/$NEW_NAME"
            
            # Update references in HTML files
            for html in ./frontEnd/*.html; do
              sed -i "s/$(basename "$file")/$NEW_NAME/g" "$html"
            done
          done

      - name: Sync to S3
        run: aws s3 sync ./frontEnd s3://mtblackheathwind-test --delete

  deploy-lambda:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v1

      - name: Set up AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Install Pulumi CLI
        uses: pulumi/action-install-pulumi-cli@v1

      - name: Pulumi login
        run: pulumi login
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Pulumi stack select
        run: pulumi stack select --stack dev
        working-directory: pulumi

      - name: Install pulumi dependencies
        run: npm i
        working-directory: pulumi

      - name: Install lambda dependencies
        run: npm i
        working-directory: lambda

      - name: Pulumi up
        run: pulumi up --yes
        working-directory: pulumi
